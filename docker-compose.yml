# Postgres local para desenvolvimento e testes de integração.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pentagon
      POSTGRES_PASSWORD: pentagon
      POSTGRES_DB: pentagon
    ports:
      - "5433:5432"
    volumes:
      - pentagon-db:/var/lib/postgresql/data
volumes:
  pentagon-db:
